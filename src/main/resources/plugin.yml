name: SkyGame-Control
main: ru.playerskill.control.ControlPlugin
version: 1.0.0
author: PlayeR_SkiLL und Yandex Alice AI
description: Универсальный модульный плагин управления

commands:
  control:
    description: Управление модулями плагина
    aliases: [ctrl, cont, sg]

permissions:
  control.use:
    description: Доступ к команде /control
    default: op
  control.easybans:
    default: op
  control.watchdog:
    description: Подкоманды сторожа базы данных (статус, test, test-outage)
    default: op
