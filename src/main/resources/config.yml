# ==========================================
#  Control — универсальный плагин-диспетчер
#  Комментарии в этом файле сохранятся:
#  плагин не перезаписывает конфиг.
# ==========================================

# Модуль 1: фикс бага MC-849.
# Не даёт серверу «доедать» еду и допивать зелья,
# которые клиент уже отменил (удары в дуэли с поеданием яблок).
eat-fix:
  # Рычаг включения модуля
  enabled: true
  # Отладочный режим с сообщениями в консоль об отменах
  debug: false

# ------------------------------------------
# Сообщения плагина. Переводите на свой вкус.
# Поддерживаются цветовые коды через &.
# ------------------------------------------
messages:
  prefix: "&8[&bControl&8] &r"
  reloaded: "&aКонфигурация перезагружена. Активных модулей: &f{count}"
  no-permission: "&cНедостаточно прав."
  usage: "&cИспользование: /control reload"
