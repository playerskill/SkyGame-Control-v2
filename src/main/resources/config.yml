
# ==========================================
#  Control — универсальный плагин-диспетчер
#  Комментарии в этом файле сохранятся:
#  плагин не перезаписывает конфиг.
# ==========================================


# Общее подключение к MySQL.
# База общая для нескольких плагинов, поэтому вынесена
# в отдельный раздел — модули берут отсюда и только отсюда.
database:
  host: "localhost"
  port: 3306
  database: "bans"
  user: "root"
  password: ""
  use-utf8: true

#------------------------------------------------------------

# Модуль 1: фикс бага MC-849.
# Не даёт серверу «доедать» еду и допивать зелья,
# которые клиент уже отменил (удары в дуэли с поеданием яблок).
eat-fix:
  # Рычаг включения модуля
  enabled: true
  # Отладочный режим с сообщениями в консоль об отменах
  debug: false


# Модуль 2 - EasyBans: очистка истёкших банов.
# time — когда бан выдан, expiry — когда он закончится (мс с эпохи).
# Модуль только добавляет команду и не влияет на игру,
# поэтому выключателя у него нет.
easybans:
  # Таблица с банами
  table: "banlist"
  # Сначала только показывает, сколько записей будет удалено.
  # Проверь число и глазами выборку — потом переключай в false.
  # Это режим «только посмотреть», когда плагин считает,
  # сколько строк попадёт под удаление, но не удаляет их из базы.
  dry-run: true
  # Условие «истёкший бан»: обе временные метки уже в прошлом,
  # вечные (0/-1) отсечены. Даже при багах плагина с перепутанными
  # датами активные баны не удалятся.
  where: "(time > 0 AND time < (UNIX_TIMESTAMP() * 1000)) AND (expiry > 0 AND expiry < (UNIX_TIMESTAMP() * 1000))"
  # Шаблоны запросов. {table} и {where} подставляются из этого же конфига.
  # Можно переписать под любую схему базы.
  count-query: "SELECT COUNT(*) FROM {table} WHERE {where}"
  delete-query: "DELETE FROM {table} WHERE {where}"


# Модуль 3: SkyWatchdog — сторож базы данных.
# Периодически проверяет доступность MySQL; при сбое блокирует
# экономику (Vault), через kick-after-seconds кикает всех игроков
# и запрещает новые подключения. Вайтлист сервера не изменяется.
watchdog:
  # Выключатель модуля: false — сторож спит, проверок нет.
  enabled: true
  checks:
    check-interval-seconds: 30          # период фоновой проверки при нормальной работе
    outage-check-interval-seconds: 10   # период проверки во время сбоя и окна восстановления
    kick-after-seconds: 300             # через сколько секунд сбоя кикать всех и запрещать вход
    recovery-confirm-seconds: 120       # сколько база должна быть доступна подряд, чтобы снять блокировку (0 — снимать сразу)
  bypass-players:              # кто может заходить и не кикается при сбое
    - "PlayeR_SkiLL"

# ------------------------------------------
# Перевод сообщений плагина.
# ------------------------------------------
messages:
  prefix: "&6[&bSkyGame&c-&aControl&6] &r"
  reloaded: "&aКонфигурация перезагружена. Активных модулей: &6{count}"
  no-permission: "&cНедостаточно прав."
  unknown-subcommand: "&cНеизвестная подкоманда. См. /control"
  usage: "&cИспользование: &f/control reload | /control easybans | /control watchdog"

  # --- Watchdog ---
  watchdog-kick: "&cОшибка базы данных, срочно сообщите об этом в группе тг - t.me/skygame001"
  watchdog-join-blocked: "&cСервер временно закрыт: сбой базы данных. Попробуйте позже."
  watchdog-outage: |
    &c&l[Сервер] ВНИМАНИЕ!
    &cОбнаружен сбой базы данных.
    &7Операции с валютой приостановлены.
    &7Мы уже знаем о проблеме и чиним.
  watchdog-recovered: "&a[Сервер] База данных восстановлена. Вход открыт."
  watchdog-economy-blocked: "&cОперации с валютой временно недоступны: сбой базы данных."

  # --- EasyBans ---
  easybans-started: "&7Проверяю истёкшие баны..."
  easybans-usage: "&cИспользование: &f/control easybans deleteexpirybans"
  easybans-dry-run: "&eDry-run: под условие попадает &f{count} &eзаписей. Для удаления поставьте easybans.dry-run: false"
  easybans-done: "&aУдалено истёкших записей: &f{count}"
  easybans-none: "&7Истёкших записей не найдено."
  easybans-error: "&cОшибка обращения к базе: &f{error}"
